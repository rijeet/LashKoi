<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LashKoi — Loading</title>
  <style>
    :root {
      --bg: #0b0c10;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22d3ee;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: system-ui, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash {
      width: min(420px, 92vw);
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .logo-row img { height: 32px; width: auto; }
    .tag {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 2rem;
    }
    .spinner {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.25rem;
      border: 3px solid rgba(34, 211, 238, 0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status {
      font-size: 0.875rem;
      color: var(--muted);
      min-height: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .progress {
      height: 4px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    .progress > div {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #6366f1);
      transition: width 0.35s ease;
    }
    .stats {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: left;
      margin-bottom: 1.5rem;
      display: none;
    }
    .stats.visible { display: block; }
    .stats li { margin: 0.25rem 0; }
    .cta {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text);
      background: transparent;
      border: 2px solid rgba(34, 211, 238, 0.5);
      border-radius: 0.5rem;
      cursor: pointer;
      opacity: 0.45;
      pointer-events: none;
      transition: opacity 0.2s, box-shadow 0.2s;
    }
    .cta.ready {
      opacity: 1;
      pointer-events: auto;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.35); }
      50% { box-shadow: 0 0 20px 2px rgba(34, 211, 238, 0.25); }
    }
    .skip {
      position: fixed;
      top: 1rem;
      right: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .skip:hover { color: var(--text); }
    .blood {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(127, 29, 29, 0.95) 0%, rgba(11, 12, 16, 0.98) 70%);
      transition: opacity 0.6s ease;
    }
    .blood.active { opacity: 1; }
    .map-placeholder {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      font-size: 1.25rem;
      color: var(--muted);
    }
    .map-placeholder.show { display: flex; }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none; border-top-color: var(--accent); }
      .cta.ready { animation: none; }
    }
  </style>
</head>
<body>
  <button type="button" class="skip" id="skip">Skip to Map</button>

  <div class="splash" id="splash">
    <div class="logo-row">
      <img src="assets/brand/logo.svg" alt="" width="120" height="32" />
    </div>
    <p class="tag">Public incident map</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="status" id="status">Starting…</p>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>
    <ul class="stats" id="stats"></ul>
    <button type="button" class="cta" id="cta">Enter interactive map</button>
  </div>

  <div class="blood" id="blood"></div>
  <div class="map-placeholder" id="map">Map loads here (Phase 2)</div>

  <script>
    const STEPS = [
      { label: 'Loading incident types…', ms: 400 },
      { label: 'Loading boundaries…', ms: 500 },
      { label: 'Loading incident days…', ms: 450 },
      { label: "Loading today's reports…", ms: 600 },
      { label: 'Loading statistics…', ms: 350 },
    ];

    const MOCK_STATS = [
      { code: 'extortion', label: 'Extortion', count: 4100 },
      { code: 'dengue', label: 'Dengue', count: 3900 },
      { code: 'kidnap', label: 'Kidnap', count: 1200 },
      { code: 'measles', label: 'Measles', count: 6000 },
    ];

    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');
    const ctaEl = document.getElementById('cta');
    const statsEl = document.getElementById('stats');
    const splashEl = document.getElementById('splash');
    const bloodEl = document.getElementById('blood');
    const mapEl = document.getElementById('map');
    const skipEl = document.getElementById('skip');

    let ready = false;
    let autoTimer = null;

    function enterMap() {
      if (sessionStorage.getItem('lk_splash_seen') === '1' && !ready) {
        /* demo: still allow enter */
      }
      sessionStorage.setItem('lk_splash_seen', '1');
      splashEl.style.display = 'none';
      skipEl.style.display = 'none';
      bloodEl.classList.add('active');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(() => {
        bloodEl.classList.remove('active');
        mapEl.classList.add('show');
      }, reduced ? 300 : 2000);
    }

    async function runPrefetch() {
      for (let i = 0; i < STEPS.length; i++) {
        statusEl.textContent = STEPS[i].label;
        barEl.style.width = `${((i + 1) / STEPS.length) * 100}%`;
        await new Promise((r) => setTimeout(r, STEPS[i].ms));
      }
      statusEl.textContent = 'Ready';
      statsEl.innerHTML = MOCK_STATS
        .map((s) => `<li><strong>${s.label}</strong>: ${s.count.toLocaleString()}</li>`)
        .join('');
      statsEl.classList.add('visible');
      ready = true;
      ctaEl.classList.add('ready');
      autoTimer = setTimeout(enterMap, 12000);
    }

    ctaEl.addEventListener('click', () => {
      if (!ready) return;
      clearTimeout(autoTimer);
      enterMap();
    });
    skipEl.addEventListener('click', () => {
      clearTimeout(autoTimer);
      enterMap();
    });

    runPrefetch();
  </script>
</body>
</html>
